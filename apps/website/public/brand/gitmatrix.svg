<title>Gitmatrix — Pounce</title>
<metadata>{"name": "Pounce", "generator": "openai-codex/gpt-image-2-codex", "approval": "User selected Pounce as perfect; preserve this silhouette.", "prompt": "Create ONE original, impeccably crafted professional logo SYMBOL for Gitmatrix, an AI-agent-first git platform for ultra-fast software development. Concept: POUNCE / CAT IN MOTION. A compact abstract cat moving decisively to the right, with clearly feline pointed ears and a curled or forked tail. Invent a distinctive silhouette built from two or three broad interleaving ribbon-like paths that split and rejoin, suggesting parallel git branches and fast cooperating agents. The paths are the CAT itself, never extra diagrams. Capture nimble forward momentum with a clever economical gesture, not a sports-team mascot. More compact and upright than a leaping sportswear cat; no Puma-like stretched jumping silhouette. Warm wit, intelligence, speed, precision. Make the ears and tail readable at small scale; avoid little paws or anatomical detail that disappears. Exactly one symbol, solid pure black ink on a plain pure white background. Symbol occupies the central 65% of the square. No wordmark, no text, no initials, no G letter, no circular enclosure, no mockup, no extra variants, no shading, gradients, texture, 3D or glow. No Octocat, GitLab fox, Google, Puma or esports shield resemblance. Brand-agency level original, finished clean vector-like logo artwork, memorable at favicon size.", "conversion": "Faithful vector trace of the selected generated artwork; no redrawn replacement.", "wordmark": "Figtree Variable, weight 730, tracking -0.03em, shaped and outlined from the existing self-hosted font to match the approved viewer pairing."}</metadata>
