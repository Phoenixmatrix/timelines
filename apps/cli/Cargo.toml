[package]
name = "gitmatrix-cli"
description = "gm: the Timelines CLI, built for agents and a change-based workflow"
license = "MIT"
version = "0.1.0"
edition = "2024"

[dependencies]
cap-std = "3"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6.7", features = ["derive", "wrap_help", "env"] }
fd-lock = "4.0.4"
git2 = { version = "0.21.0", default-features = false }
ignore = "0.4"
indexmap = { version = "2", features = ["serde"] }
owo-colors = "4.4.0"
parking_lot = "0.12"
rand = "0.10.3"
rpassword = "7"
rusqlite = { version = "0.38", features = ["bundled"] }
sha2 = "0.10"
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml_ng = "0.10"
sysinfo = { version = "0.37", default-features = false, features = ["system"] }
signal-hook = "0.3"
ssh-key = { version = "0.6.7", features = ["ed25519", "p256", "p384", "rsa", "encryption", "std"] }
tempfile = "3.27.0"
thiserror = "2.0.21"
ureq = { version = "3.4.2", features = ["json"] }

[[bin]]
name = "gm"
path = "src/main.rs"

# Debuginfo only helps a debugger; panics still print backtraces, and it costs ~20% of a cold test build.
[profile.dev]
debug = 0

[profile.release]
strip = true
lto = "thin"
