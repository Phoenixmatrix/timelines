[package]
name = "gitmatrix-cli"
description = "gm: the Gitmatrix CLI, built for agents and a change-based workflow"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6.7", features = ["derive", "wrap_help", "env"] }
fd-lock = "4.0.4"
git2 = { version = "0.21.0", default-features = false }
owo-colors = "4.4.0"
rand = "0.10.3"
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
ureq = { version = "3.4.2", features = ["json"] }

[dev-dependencies]
tempfile = "3.27.0"

[[bin]]
name = "gm"
path = "src/main.rs"

[profile.release]
strip = true
lto = "thin"
