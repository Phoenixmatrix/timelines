packages:
  - apps/*
  - packages/*
  - tools/*

virtualStoreType: global

# These declarations import React types but omit the type peer dependencies.
# A global store cannot fall back to a checkout's hoisted @types directory.
packageExtensions:
  "@phosphor-icons/react@2.1.10":
    peerDependencies:
      "@types/react": "^19"
  "react-router@8.4.0":
    peerDependencies:
      "@types/react": "^19"
      "@types/react-dom": "^19"

catalogMode: prefer

catalog:
  "@base-ui/react": ^1.8.0
  "@cloudflare/vite-plugin": 2.0.0-beta.sha-52b0dc0e9
  "@phosphor-icons/react": ^2.1.10
  "@tailwindcss/vite": ^4.3.3
  "@types/node": ^24
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  "@types/semver": ^7.8.0
  "@vitejs/plugin-react": ^6.1.1
  cf: 1.0.0-beta.7
  diff: ^9.0.0
  fflate: ^0.8.3
  fzstd: ^0.1.1
  hono: ^4.13.12
  jose: ^6.2.12
  kysely-d1: 0.4.0
  kysely: ^0.29.6
  mermaid: ^12.0.0
  openpgp: ^6.3.1
  react-dom: ^19.3.0
  react-markdown: ^10.1.0
  react-router: ^8.4.0
  react: ^19.3.0
  remark-gfm: ^4.0.1
  semver: ^7.8.5
  tailwindcss: ^4.3.3
  typescript: ^7.0.2
  vite-plus: 1.0.0-rc.0
  vite: npm:@voidzero-dev/vite-plus-core@1.0.0-rc.0
  wrangler: ^4.145.0
  yaml: ^2.9.1
  zod: ^4.6.5
overrides:
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
allowBuilds:
  esbuild: true
  workerd: true
minimumReleaseAgeExclude:
  - "@cloudflare/vite-plugin@2.0.0-beta.sha-52b0dc0e9"
