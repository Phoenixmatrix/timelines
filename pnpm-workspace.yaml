packages:
  - apps/*
  - packages/*
  - tools/*

catalogMode: prefer

catalog:
  "@base-ui/react": ^1.8.0
  "@cloudflare/vite-plugin": ^1.62.3
  "@phosphor-icons/react": ^2.1.10
  "@tailwindcss/vite": ^4.3.3
  "@types/node": ^24
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  "@vitejs/plugin-react": ^6.1.1
  hono: ^4.13.12
  react: ^19.3.0
  react-dom: ^19.3.0
  react-markdown: ^10.1.0
  react-router: ^8.4.0
  remark-gfm: ^4.0.1
  tailwindcss: ^4.3.3
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@1.0.0-rc.0
  vite-plus: 1.0.0-rc.0
  wrangler: ^4.145.0
overrides:
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
allowBuilds:
  esbuild: true
  workerd: true
