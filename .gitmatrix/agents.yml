# How coding agents work on this repository. Shared: commit it.
# `gm agent setup` reads this, keeps the instruction file's gm section and the
# graph-work skill current, and records each checkout's agent (name, harness,
# model, tags) in .gitmatrix/agent.local.yml, which isn't committed.
#
# tracker:       space, and the default scope for `gm issue next`:
#                team: CORE, or under: CORE-4 for one project
# ttl:           seconds per lease (renew before it ends)
# instructions:  file: AGENTS.md (default: the harness's own)
#                ship: how work ships before an issue is completed

tracker:
  space: matrixorg
  team: CORE
ttl: 3600
instructions:
  ship: >-
    Keep Claude/Codex/OMP and authoritative source edits local. Follow CONTRIBUTING.md's
    Agent-first development workflow. Execution selection is --execution, then
    GITMATRIX_AGENT_EXECUTION, then .gitmatrix/development.json, then local.
    When cloudflare is selected, use `node tools/agent/entry.ts` for setup/up,
    sync, scoped gm, checks, logs, debug and artifacts; use its `run -- <argv>`
    for remote vp/Cargo/browser work, never run heavy tooling on the host or
    silently fall back to local. Do not sync secrets, credential files or
    generated output back into authoritative source. Cloud mode explicitly
    trusts its disposable runtime with the current validated cf access token;
    the refresh credential stays local. AI remains opt-in.
    Sync the authoritative source workspace. In local mode, run `vp install`,
    inspect `vp run ready --dry-run`, then run `vp run ready`. In cloud mode,
    use `node tools/agent/entry.ts setup` for remote installation, sync source,
    inspect `node tools/agent/entry.ts check --dry-run`, then run
    `node tools/agent/entry.ts check`. These are the automatically selective
    required gate. Do not routinely add blanket check/test/build runs,
    `vp run agent test` or `--all`; use `--all` only when comprehensive
    verification is deliberately required. Local selection covers all
    unlanded committed, staged, unstaged and untracked work against the merge
    base with local `origin/main` and does not fetch. Use `--base` only for
    the actual integration branch, never to hide work. Accept automatic full
    fallback for broad or unknown changes, including remote source snapshots
    without Git metadata. Preserve required real consumer smoke checks,
    explicit AI verification and deployment-boundary checks in `AGENTS.md`;
    see `CONTRIBUTING.md#completion-gate` for coverage. Then follow the queue or
    timeline shipping workflow below from the authoritative local worktree
    and verify actual landing and required CI/deployment before completing
    the issue. Destroy the owned cloud environment when finished; stop is
    not resource cleanup.
