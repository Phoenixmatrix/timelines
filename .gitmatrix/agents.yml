# How coding agents work on this repository. Shared: commit it.
# `gm agent setup` reads this, keeps the instruction file's gm section and the
# graph-work skill current, and records each checkout's agent (name, harness,
# model, tags) in .gitmatrix/agent.local.yml, which isn't committed.
#
# tracker:       owner, and the default scope for `gm issue next`:
#                team: CORE, or under: CORE-4 for one project
# ttl:           seconds per lease (renew before it ends)
# instructions:  file: AGENTS.md (default: the harness's own)
#                ship: how work ships before an issue is completed

tracker:
  owner: matrixorg
  team: CORE
ttl: 3600
instructions:
  ship: >-
    sync the source workspace and run `vp install`; inspect
    `vp run ready --dry-run`, then run `vp run ready`, the automatically
    selective required gate. Do not routinely add blanket check/test/build
    runs, `vp run agent test` or `--all`; use `--all` only when comprehensive
    verification is deliberately required. Selection covers all unlanded
    committed, staged, unstaged and untracked work against the merge base with
    local `origin/main` and does not fetch. Use `--base` only for the actual
    integration branch, never to hide work. Accept automatic full fallback
    for broad or unknown changes. Preserve required real
    consumer smoke checks, explicit AI verification and deployment-boundary
    checks in `AGENTS.md`; see `README.md#completion-gate` for coverage.
    Then follow the queue or timeline shipping workflow below and verify
    actual landing and required CI/deployment before completing the issue
