# Gitmatrix is the source of truth; GitHub is a mirror only.
# Source CI runs on the trusted Linux development host with cf authentication
# and user systemd. Vite starts local runners on demand. The live gate provisions
# dedicated resources; its finally cleanup and the hourly janitor both apply.
# All four jobs are required, but exchange no artifacts. Keep them in one stage
# so the stage-based scheduler never serializes build behind independent E2E.
on:
  push: {}

# Four independent jobs must not each launch 24 compiler workers on this host.
# Leave CPU capacity for JavaScript tests and the live server during cold builds.
env:
  CARGO_BUILD_JOBS: "4"

jobs:
  check:
    steps:
      - name: Install
        run: pnpm install --frozen-lockfile
      # Binding types are generated (and gitignored); type-aware lint needs them.
      - name: Generate Worker types
        run: vp run website#cf-typegen
      - name: Format, lint, type check
        run: vp check
      - name: Format and lint gm
        run: vp run cli#check
      - name: All application and harness type contracts
        run: vp run --no-cache website#typecheck && vp run --no-cache @gitmatrix/agent#typecheck

  test:
    timeout_minutes: 30
    steps:
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Generate Worker types
        run: vp run website#cf-typegen
      - name: Tests (web and gm)
        run: vp run -r --concurrency-limit 1 --no-cache test

  build:
    steps:
      - name: Install
        run: pnpm install --frozen-lockfile
      # Fresh clones gain nothing from the task cache, and its file tracking
      # can fail to spawn native tools (spawn EBUSY).
      - name: Build
        run: vp run -r --concurrency-limit 1 --no-cache build
      - name: Publish changed gm CLI on main
        run: node tools/agent/publish-cli.ts

  e2e:
    timeout_minutes: 30
    steps:
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Live isolated CLI, API, browser, CI and mirror journeys (no AI)
        run: vp run agent test
