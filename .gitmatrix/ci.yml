# Gitmatrix is the source of truth; GitHub is a mirror only.
# Pushes to production run check, test and build, each in its own Cloudflare
# Sandbox container (runner "sandbox"). They exchange no artifacts; keep them in
# one stage so the stage-based scheduler never serializes one behind another.
# Those get standard-4 (4 vCPU, 12 GiB): on the default standard-1 (4 GiB),
# oxlint's allocator failed before linting and the test container was lost.
# On main, a deploy job then ships only what changed (see the job below).
#
# Fewer runs without slower answers (CORE-23): gm's Rust work is its own `cli`
# job, skipped on pushes that leave apps/cli as it was when the job last passed.
# With 4 runs in flight on a branch, further pushes wait in one held run that
# covers them all (`gm runs wait` follows it), and a commit already in flight
# isn't run twice.
#
# Non-AI E2E is too expensive to run per push. It runs only on local runners
# (the trusted Linux host, with cf authentication and user systemd), where
# `vp run ready` gates work before it lands; `instance` is ignored there. The
# live gate provisions dedicated resources; its finally cleanup and the hourly
# janitor both apply.
#
# Previews (CORE-80): each checkpoint of a timeline gets a preview of the app
# (`on: preview`, the preview, preview-teardown and preview-reconcile jobs
# below), the reference implementation of the preview contract;
# apps/website/README.md, "Gitmatrix's own previews". Preview runs run only
# those three jobs.
#
# Steps (CORE-237): every push to a timeline/<slug> bookmark also gets a step
# run, the light check an agent's step deserves (CORE-235): only the step-*
# jobs below. Lint and types, and the website's unit tests related to the
# files the step changed; no E2E, builds or previews. `gm test` runs the same
# jobs locally (local: true) before `gm step` commits.
on:
  push:
    coalesce_after: 4
  preview: {}
  step: {}

# Four independent jobs must not each launch 24 compiler workers on this host.
# Leave CPU capacity for JavaScript tests and the live server during cold builds.
env:
  CARGO_BUILD_JOBS: "4"

jobs:
  step-check:
    on: step
    local: true
    instance: standard-4
    timeout_minutes: 15
    steps:
      # Locally the checkout is already installed and the website is typed.
      - name: Install
        run: '[ -n "${GITMATRIX_LOCAL:-}" ] || { pnpm install --frozen-lockfile && vp run website#cf-typegen; }'
      # Also runs locally: the remote Worker's generated bindings must precede vp check.
      # Typegen mode is offline and does not provision a remote session or container.
      - name: Remote Worker types and compile contract
        run: vp run --no-cache @gitmatrix/remote#typecheck
      - name: Format, lint, type check
        run: vp check

  step-unit:
    on: step
    local: true
    instance: standard-2
    timeout_minutes: 15
    steps:
      - name: Install
        run: '[ -n "${GITMATRIX_LOCAL:-}" ] || { pnpm install --frozen-lockfile && vp run website#cf-typegen; }'
      # The step's own changes: locally the working copy against its parent
      # (git's HEAD in a gm checkout); in a step run the commit against its
      # parent, or everything when a shallow clone lacks it.
      - name: Unit tests related to the step's changes
        run: |
          cd apps/website
          if [ -n "${GITMATRIX_LOCAL:-}" ]; then since=HEAD
          elif git rev-parse -q --verify HEAD~1 >/dev/null; then since=HEAD~1
          else since=""; fi
          vp test run --project unit ${since:+--changed=$since} --passWithNoTests

  check:
    verification: context-invariant-v1
    instance: standard-4
    steps:
      - name: Install
        run: pnpm install --frozen-lockfile
      # Binding types are generated (and gitignored); type-aware lint needs them.
      - name: Generate Worker types
        run: vp run website#cf-typegen
      - name: Remote Worker types and compile contract
        run: vp run --no-cache @gitmatrix/remote#typecheck
      - name: Format, lint, type check
        run: vp check
      # Remote types were checked above so root lint can consume their generated bindings.
      - name: Application and remaining harness type contracts
        run: >-
          vp run --no-cache website#typecheck && vp run --no-cache @gitmatrix/agent#typecheck
          && vp run --no-cache @gitmatrix/preview#typecheck && vp run --no-cache site#typecheck

  test:
    verification: context-invariant-v1
    instance: standard-4
    timeout_minutes: 30
    steps:
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Generate Worker types
        run: vp run website#cf-typegen
      # apps/website's browser-mode tests (*.browser.test.tsx) run in Chromium's
      # headless shell. The CI image bakes it, and its system libraries, for the
      # Playwright version in ci/Dockerfile, so in a Sandbox this step has nothing
      # to do. After a Playwright upgrade, until the image is redeployed, it
      # installs the libraries (as root, when the image's marker names another
      # version) and fetches the new revision (~20s). A local runner isn't root,
      # already has the libraries, and uses the user's browser cache.
      - name: Chromium for browser-mode tests
        run: |
          version=$(pnpm --filter website exec playwright --version | awk '{print $2}')
          if [ "$(id -u)" = 0 ] && [ ! -e "/usr/local/share/playwright-deps/$version" ]; then
            pnpm --filter website exec playwright install-deps chromium
          fi
          pnpm --filter website exec playwright install --only-shell chromium
      - name: Tests (everything but gm, which the cli job tests)
        run: vp run --filter '!cli' --concurrency-limit 1 --no-cache test

  build:
    verification: context-invariant-v1
    instance: standard-4
    # Building the CI image needs Docker, which a Sandbox doesn't have.
    env:
      GITMATRIX_CONTAINER_IMAGES: skip
    steps:
      - name: Install
        run: pnpm install --frozen-lockfile
      # Use only a runtime-equivalent successful job as a change baseline. The
      # planner defaults to the full build if evidence/history is unavailable.
      - name: Build (gm's release build runs when deploy publishes a new version)
        run: node tools/agent/ci-build.ts

  # gm, the Rust CLI: skipped while apps/cli is unchanged since it last passed,
  # and then counts as passed for deploy.
  cli:
    verification: context-invariant-v1
    instance: standard-4
    paths: [apps/cli]
    steps:
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Format and lint gm
        run: vp run --no-cache cli#check
      - name: Test gm
        run: vp run --no-cache cli#test

  e2e:
    if: runner == "local" && trigger != "preview"
    timeout_minutes: 30
    steps:
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Live isolated CLI, API, browser, CI and mirror journeys (no AI)
        run: vp run agent test

  # On main, once the gates pass: publish gm when its source changed, then
  # deploy what changed since the deployed Worker version (tools/agent/deploy.ts):
  # migrations, then the Worker. A changed CI image fails the job after the
  # rest has shipped; deploy it from a machine with Docker (`vp run deploy`).
  deploy:
    needs: [check, test, build, cli]
    # A preview run on main (a landed timeline's teardown or revival) must never deploy.
    if: branch == "main" && runner == "sandbox" && trigger != "preview"
    # One deploy at a time, and a waiting deploy gives way to a newer push's: a
    # burst of pushes deploys once, from the newest commit.
    concurrency: production
    instance: standard-4
    secrets: [CLOUDFLARE_API_TOKEN]
    env:
      CLOUDFLARE_ACCOUNT_ID: "0e28c6400ae60277d5330899f4db57e4"
      GITMATRIX_CLI_PROVISION_ARM64: "1"
    steps:
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Publish gm if it changed
        run: node tools/agent/publish-cli.ts
      - name: Deploy what changed
        run: node tools/agent/deploy.ts

  # A timeline's preview, at each checkpoint and on revival: one Worker Preview
  # per timeline (timeline-<slug>), rebuilt from the checkpoint's commit on
  # fresh D1s (migrations plus seed), its own bucket and Artifacts namespace,
  # and the agent fixtures; then recorded with `gm deploy record`. Sandbox
  # only: a local server's previews would deploy from a development machine.
  # One create at a time per repository; a waiting create gives way to the
  # timeline's newer one. See tools/preview/preview.ts.
  preview:
    if: trigger == "preview" && action == "create" && runner == "sandbox"
    concurrency: preview
    instance: standard-4
    timeout_minutes: 40
    secrets: [CLOUDFLARE_API_TOKEN, GITMATRIX_ACCESS_TOKEN]
    env:
      CLOUDFLARE_ACCOUNT_ID: "0e28c6400ae60277d5330899f4db57e4"
      GITMATRIX_PREVIEW_ACCESS_ISSUER: "https://pileofcats.cloudflareaccess.com"
      GITMATRIX_PREVIEW_ACCESS_AUD: "927abb73ba3900f5dbc9542d57ec887a1d8689894e6c44e8b0e270e23bc5894c"
    steps:
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Deploy the timeline's preview
        run: node tools/preview/preview.ts create

  # When a timeline's previews expire: delete the Preview, its D1s, bucket and
  # Artifacts namespace. Gitmatrix has already marked the records expired.
  preview-teardown:
    if: trigger == "preview" && action == "teardown" && runner == "sandbox"
    secrets: [CLOUDFLARE_API_TOKEN]
    env:
      CLOUDFLARE_ACCOUNT_ID: "0e28c6400ae60277d5330899f4db57e4"
    steps:
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Delete the timeline's preview
        run: node tools/preview/preview.ts teardown

  # After each teardown: delete gitmatrix-preview-* resources no live preview
  # owns (a create whose failure went unrecorded, a failed record, which never
  # expires, a namespace Cloudflare wouldn't delete). Live timelines come from
  # every source (deployments/live-timelines); one whose Preview isn't listed
  # is only reported (CORE-216). No concurrency group, so a teardown never
  # supersedes a waiting create: anything under two hours old (creates time out
  # at 40 minutes), or sharing a name with something that young, is left. At
  # most 20 deletions, none started (nor any cf call inside one) after 8
  # minutes, and a short timeout: the teardown run completes only once this job
  # ends, and ci.yml has no allow-failure. So the reconcile step exits 0
  # whatever happens to it: any listing error deletes nothing, and skips, setup
  # errors and failed deletions are logged (a failed teardown run makes the
  # sweep start another). The job can still fail, e.g. if `pnpm install` does.
  # A teardown runs the torn-down checkpoint's own reconcile code; answering
  # anything but 200 from live-timelines stops it. See tools/preview/preview.ts.
  preview-reconcile:
    if: trigger == "preview" && action == "teardown" && runner == "sandbox"
    needs: [preview-teardown]
    timeout_minutes: 15
    secrets: [CLOUDFLARE_API_TOKEN]
    env:
      CLOUDFLARE_ACCOUNT_ID: "0e28c6400ae60277d5330899f4db57e4"
    steps:
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Delete what no live preview owns
        run: node tools/preview/preview.ts reconcile --max 20
